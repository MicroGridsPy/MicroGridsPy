[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "microgridspy"
description = "Bottom-up, open-source optimization tool for planning mini-grids in remote areas."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alessandro Onori" },
    { name = "MicroGridsPy contributors" },
]
keywords = ["energy", "mini-grid", "optimization", "linopy", "rural electrification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]                       # version is derived from git tags (hatch-vcs)

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2024.1",
    "linopy>=0.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "openpyxl>=3.1",                        # Excel result export (pandas ExcelWriter)
]

[project.optional-dependencies]
gui    = ["streamlit>=1.36"]
highs  = ["highspy>=1.7"]                   # open-source solver
gurobi = ["gurobipy>=11"]                   # commercial solver (license required)
dev    = ["pytest>=8", "ruff==0.16.7", "coverage[toml]", "build"]
docs   = ["zensical", "mkdocstrings-python"]  # site generator + API extraction
all    = ["microgridspy[gui,highs,dev,docs]"]

[project.scripts]
microgridspy = "microgridspy.cli:main"
microgridspy-gui = "microgridspy.app.launcher:main"

[project.urls]
Homepage = "https://github.com/MicroGridsPy/MicroGridsPy"
Source = "https://github.com/MicroGridsPy/MicroGridsPy"
Documentation = "https://microgridspy-package-docs.readthedocs.io/"
Issues = "https://github.com/MicroGridsPy/MicroGridsPy/issues"
Changelog = "https://github.com/MicroGridsPy/MicroGridsPy/blob/master/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"                              # derive version from git tag vX.Y.Z

[tool.hatch.build.targets.wheel]
packages = ["src/microgridspy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]         # errors, pyflakes, isort, pyupgrade, bugbear
ignore = [
    "E501",  # line length is owned by `ruff format`, not enforced by the linter
    "B904",  # raise ... from: exception chaining not enforced yet (stylistic)
    "B905",  # zip() strict=: not enforced yet (stylistic)
    "B007",  # unused loop control variable: deferred
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["microgridspy"]
branch = true
# The Streamlit GUI is exercised interactively, not in the headless test suite.
omit = ["src/microgridspy/app/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
