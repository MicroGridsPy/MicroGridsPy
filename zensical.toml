[project]
site_name = "MicroGridsPy"
site_description = "Bottom-up optimization tool for planning mini-grids in remote areas."
site_url = "https://microgridspy.readthedocs.io/"
repo_url = "https://github.com/MicroGridsPy/MicroGridsPy"
repo_name = "MicroGridsPy/MicroGridsPy"

nav = [
  { "Home" = "index.md" },
  { "API Reference" = "api.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown features (code highlighting, admonitions, math, tabs) - handled by Zensical.
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

# Automatic Python API reference - handled by mkdocstrings (Python handler).
# Griffe reads the package statically from src/, so the package need not be installed.
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false
options.show_root_heading = true
options.heading_level = 3
