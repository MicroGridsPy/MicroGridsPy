[project]
site_name = "MicroGridsPy"
site_description = "Bottom-up optimization tool for planning mini-grids in remote areas."
site_url = "https://microgridspy.readthedocs.io/"
repo_url = "https://github.com/MicroGridsPy/MicroGridsPy"
repo_name = "MicroGridsPy/MicroGridsPy"

nav = [
  { "Home" = "index.md" },

  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },

  { "User Guide" = [
    { "Input Data" = "user-guide/input-data.md" },
    { "Planning Modes" = "user-guide/planning-modes.md" },
    { "Running a Model" = "user-guide/running.md" },
    { "Results" = "user-guide/results.md" },
  ] },

  { "Tutorials" = [
    { "Typical Year" = "tutorials/typical-year.md" },
    { "Multi-Year" = "tutorials/multi-year.md" },
  ] },

  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "The Kalobeyei Case Study" = "examples/case-study.md" },
    { "Technology Choice" = "examples/technology-choice.md" },
    { "Planning for Growth" = "examples/planning-for-growth.md" },
    { "Uncertainty & Externalities" = "examples/uncertainty.md" },
  ] },

  { "Methodology" = [
    { "Overview" = "methodology/overview.md" },
    { "Planning Modes" = "methodology/planning-modes.md" },
    { "Objective Function" = "methodology/objective-function.md" },
    { "Cost Accounting" = "methodology/cost-accounting.md" },
    { "Renewable Technologies" = "methodology/renewable.md" },
    { "Battery" = "methodology/battery.md" },
    { "Generators" = "methodology/generator.md" },
    { "Grid Connection" = "methodology/grid.md" },
    { "System Constraints" = "methodology/constraints.md" },
  ] },

  { "Data Reference" = [
    { "Overview" = "data-reference/overview.md" },
    { "Internal Data Contract" = "data-reference/data-contract.md" },
  ] },

  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Project Management" = "api/project.md" },
    { "Models" = "api/models.md" },
    { "Optimization" = "api/optimization.md" },
    { "Results" = "api/results.md" },
  ] },

  { "Developers" = [
    { "Architecture" = "developers/architecture.md" },
    { "Contributing" = "developers/contributing.md" },
  ] },
]

# MathJax: local config (defines window.MathJax) must load before the CDN engine.
# Renders the LaTeX produced by pymdownx.arithmatex (generic mode).
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

# Local styles: horizontally scrollable display equations, figure captions.
extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown features (code highlighting, admonitions, math, tabs) - handled by Zensical.
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

# Automatic Python API reference - handled by mkdocstrings (Python handler).
# Griffe reads the package statically from src/, so the package need not be installed.
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false
options.show_root_heading = true
options.heading_level = 3
